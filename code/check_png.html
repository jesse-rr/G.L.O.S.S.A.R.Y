<!DOCTYPE html>
<html><body>
<script>
const img = new Image();
img.onload = () => {
    const canvas = document.createElement('canvas');
    canvas.width = 640; canvas.height = 360;
    const ctx = canvas.getContext('2d');
    ctx.drawImage(img, 0, 0, 640, 360, 0, 0, 640, 360);
    const data = ctx.getImageData(0,0,640,360).data;
    let alpha = 0;
    for(let i=3; i<data.length; i+=4) alpha += data[i];
    console.log("Avg alpha frame 0:", alpha / (640*360));
};
img.src = 'public/assets/exports/UI/Transitions.png';
</script>
</body></html>
